[project]
name = "hermes-ngrok-mcp"
version = "1.0.0"
description = "MCP server that lets the Hermes agent open short-lived, TOTP-protected ngrok tunnels on demand."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aquadrox" }]
keywords = ["mcp", "ngrok", "hermes", "tunnel", "totp", "mfa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "ngrok>=1.7,<2",
    "pyotp>=2.9,<3",
    "segno>=1.6,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx2>=2.16,<3",
    "uvicorn>=0.30,<1",
    "tzdata>=2024.1",
]

[project.scripts]
hermes-ngrok-mcp = "hermes_ngrok_mcp.cli:main"

[project.urls]
Source = "https://github.com/Aquadrox/Hermes_MCP"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_ngrok_mcp"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL", "PT", "RET", "TRY", "C4"]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are intentional
    "PLR2004",  # magic values are fine in a handful of protocol constants
    "TRY003",   # descriptive exception messages are part of the agent-facing API
    "TRY004",   # pydantic validators must raise ValueError, not TypeError
    "ASYNC109", # probes implement their own time budget across several network calls
    "RUF001",   # French text legitimately contains typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLR0917", "PLC0415", "TRY", "ASYNC"]
"src/hermes_ngrok_mcp/server.py" = ["S105", "S106"]  # "password_delivery" is not a password

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["hermes_ngrok_mcp"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "segno.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["hermes_ngrok_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
